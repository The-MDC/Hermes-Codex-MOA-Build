# Hermes Agent — three providers on three independent rate-limit buckets.
#
# Copy to ~/.hermes/config.yaml (back up whatever is there first), then run
#     scripts/nim-preflight.sh
# before you trust it. The preflight proves the key works, proves traffic lands on
# NVIDIA and not somewhere else, and reports what the endpoint actually supports.
#
# NO KEY GOES IN THIS FILE. Every provider reads `key_env`. Put them in
# ~/.hermes/.env (chmod 600) or export them:
#     NVIDIA_API_KEY=nvapi-...      https://build.nvidia.com  -> "Get API Key"
#     HF_TOKEN=hf_...               https://huggingface.co/settings/tokens
#     OPENROUTER_API_KEY=sk-or-v1-...   https://openrouter.ai/keys
# Only NVIDIA_API_KEY is required; the other two each enable one tier below.
# The local tier needs no key at all — it is a server on your own machine.
#
# ---------------------------------------------------------------------------
# WHY THE SPLIT
#
# Kimi-K3 is 2.8T parameters. The smallest unpruned GGUF is 466 GB and the smallest
# pruned one anybody has shown working is 319 GiB at 0.48 tok/s. There is no desktop
# build. It is an API model, and NVIDIA NIM is where the account already is. See
# docs/models/kimi-k3-quants.md for the full survey.
#
# The binding constraint is not money, it is requests. NIM's free tier runs around
# 40 RPM and Kimi-K3 users report 429s on NVIDIA's own forums. Hermes subagents fan
# out — a single delegation batch can spend the whole minute. So the parent reasons
# on NIM and the subagents run somewhere else entirely.
#
# "Somewhere else" used to mean a local llama-server. It does not any more: hosting a
# 35B-class model needs ~23 GB resident (21.2 GB of Q4_K_M weights plus KV), which is
# a 32 GB-unified Mac or a 24 GB card, not a normal laptop. The local tier was never
# the point — keeping children off the metered bucket was. A second *cloud* provider
# does that job with nothing on your machine.
#
# So: three providers on three independent rate-limit buckets. A 429 on one does not
# touch the others.
#
#   parent      NVIDIA NIM          Kimi-K3            reasoning, vision, 1M ctx
#   subagents   HF Inference        Qwen3.6-35B-A3B    coding; 3B active, so cheap
#   fallback    OpenRouter          Qwen3.5-122B-A10B  tool use + vision, if NIM 429s
#   floor       your laptop         Hermes-4-14B       8.1-12.1 GB, no key, no limit
#
# THE LOCAL FLOOR is the one tier nothing can rate-limit, meter or take offline. The
# three cloud tiers all fail the same way at once — no network.
#
# Hermes-4-14B is NousResearch's own model, from the people who build Hermes Agent, so
# "optimized for Hermes" is literal rather than a claim: ChatML, function calling, tool
# use, JSON mode, structured outputs and hybrid reasoning are what it was post-trained
# for, on a Qwen3-14B base. Sizes (bartowski imatrix GGUFs):
#
#   IQ4_XS   8.11 GB     16 GB machine, leaves room for KV and everything else
#   Q4_K_M   9.00 GB     16 GB with little else running
#   Q5_K_M  10.51 GB     24 GB machine
#   Q6_K    12.12 GB  <- chosen. At 14B, quantization damage is proportionally worse
#                        than on a large model; this buys the least of it short of Q8.
#
# Hermes-4.3-36B is newer and stronger but its Q4_K_M is 21.76 GB — the same class as
# the local model that already did not fit. Not an option on a laptop.
#
# Too tight even at IQ4_XS? TokenRhythm/NeoHorse-1-4B is 2.71 GB at Q4_K_M and 4.48 GB
# at Q8_0, Apache-2.0, purpose-built for agent harnesses: tau2-Bench 88.46 (best in its
# 4B cohort), BFCL v4 61.79, IFBench 65.33. Swap the model and api lines below.
#
# None of these is a peer of the tiers above: 14B against 36B and 2.8T. Use the floor
# when the others cannot be reached, or for narrow tool-calling where a big model is
# waste.
#
# Both Qwen models are Apache-2.0: free weights, commercial use, no licence fee. If
# you later want them on your own GPUs, NVIDIA ships a NIM container for the 35B —
# nvcr.io/nim/qwen/qwen3.6-35b-a3b — with function calling and video input, and a
# DGX Spark (arm64) build. That keeps everything on the NVIDIA account with no shared
# rate limit. See docs/models/running-the-stack.md.
# ---------------------------------------------------------------------------

providers:

  nvidia-nim:
    name: "NVIDIA NIM (build.nvidia.com)"
    api: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    transport: chat_completions
    default_model: moonshotai/kimi-k3
    models:
      - moonshotai/kimi-k3
    # Pin the picker to the line above. Without this Hermes live-probes the
    # endpoint's /models and a `models:` list alone does NOT whitelist — the
    # HF router and OpenRouter each return hundreds.
    discover_models: false
    # Kimi-K3's architectural maximum is 1,048,576. NIM serves a smaller window than
    # that; nim-preflight.sh reports what the endpoint advertises. Set this to the
    # number it prints, not to the architectural one — overstating it makes Hermes
    # pack context it will get a 400 back for.
    context_length: 131072
    extra_body:
      # Kimi-K3 is always-thinking. `max` is the model default; `low` and `high` cut
      # the reasoning budget. On a 40 RPM tier the thinking tokens are your real cost,
      # so drop to `high` if replies feel slow for the value.
      reasoning_effort: max

  hf-router:
    name: "Hugging Face Inference Providers"
    # OpenAI-compatible router in front of every HF inference provider. A separate
    # rate-limit bucket from NIM, which is the entire reason it is here.
    api: https://router.huggingface.co/v1
    key_env: HF_TOKEN
    transport: chat_completions
    # Bare id lets HF pick the provider. Pin one by suffixing it —
    # `Qwen/Qwen3.6-35B-A3B:featherless-ai` or `:scaleway` are both live — or use
    # `:fastest` to let HF route on latency.
    default_model: Qwen/Qwen3.6-35B-A3B
    models:
      - Qwen/Qwen3.6-35B-A3B
    # Pin the picker to the line above. Without this Hermes live-probes the
    # endpoint's /models and a `models:` list alone does NOT whitelist — the
    # HF router and OpenRouter each return hundreds.
    discover_models: false
    # 36B total, 3B active. SWE-bench Verified 73.4%, Terminal-Bench 2.0 51.5%,
    # Apache-2.0, native image + video. The 73.4 was measured on Alibaba's own agent
    # scaffold rather than the public harness, so treat the digit as vendor-reported.
    context_length: 262144

  or-fallback:
    name: "OpenRouter"
    api: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    transport: chat_completions
    # Third bucket. Better tool use than the 35B (BFCL-V4 72.2 vs GPT-5 mini's 55.5)
    # and better vision (MMMU-Pro 76.9, above Claude Sonnet 4.5's 75.0), at 10B active
    # instead of 3B. Apache-2.0. Failing over to it is a trade, not a downgrade: you
    # gain tool-calling and vision, you lose a little raw coding.
    default_model: qwen/qwen3.5-122b-a10b
    models:
      - qwen/qwen3.5-122b-a10b
    # Pin the picker to the line above. Without this Hermes live-probes the
    # endpoint's /models and a `models:` list alone does NOT whitelist — the
    # HF router and OpenRouter each return hundreds.
    discover_models: false
    context_length: 262144

  local:
    name: "Hermes-4-14B (this machine)"
    # llama.cpp: llama-server --port 8080  ->  http://127.0.0.1:8080/v1
    # Ollama:    ollama serve              ->  http://127.0.0.1:11434/v1
    api: http://127.0.0.1:8080/v1
    # Loopback only. No key_env because there is no key: a server on your own machine
    # authenticates nothing. The CI check that forbids inline keys exempts loopback
    # hosts for exactly this reason — see .github/workflows/checks.yml.
    api_key: "no-key-required"
    transport: chat_completions
    default_model: Hermes-4-14B
    models:
      - Hermes-4-14B
    # Pin the picker to the line above. Without this Hermes live-probes the
    # endpoint's /models and a `models:` list alone does NOT whitelist — the
    # HF router and OpenRouter each return hundreds.
    discover_models: false
    # KV cache is what actually hurts on a laptop, not the weights, so this is set far
    # below the model's native window on purpose. Raise it only as far as RAM tolerates.
    context_length: 32768
    extra_body:
      # Hermes 4 is hybrid-mode: it reasons only when asked. Leave thinking off for the
      # tool-calling this tier exists to do — reasoning tokens are pure latency on a
      # machine already decoding slowly, and tool calls do not benefit from them.
      chat_template_kwargs:
        thinking: false

model:
  # Named-provider form. If your Hermes build rejects `custom:<name>` here, leave
  # `provider: custom` + `base_url:` out entirely and select the provider once at
  # runtime with:  /model custom:nvidia-nim:moonshotai/kimi-k3
  #
  # Do NOT write `provider: custom` with `base_url:` and `default: moonshotai/kimi-k3`
  # together. `moonshotai/kimi-k3` is also an OpenRouter catalog slug, and Hermes has
  # an open bug (NousResearch/hermes-agent#39753) where a model name matching the
  # catalog overrides an explicit custom base_url and routes to OpenRouter instead —
  # sending your NVIDIA key to a third party. The named-provider form routes by
  # provider key rather than by model-name detection. nim-preflight.sh checks that
  # the traffic actually landed on NVIDIA.
  provider: "custom:nvidia-nim"
  default: moonshotai/kimi-k3

  # Moonshot's published sampling for K3. top_p 1.0 for agentic work, 0.95 single-step.
  temperature: 1.0
  top_p: 1.0

fallback_providers:
  # When NIM returns 429 — and on a free tier it will — fall through to a different
  # provider rather than stopping. `key_env` keeps the key out of this file.
  - provider: custom
    model: qwen/qwen3.5-122b-a10b
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
  # Last resort. Slower and much smaller than anything above it, but it is the only
  # entry that survives losing the network, and nothing can rate-limit it.
  - provider: custom
    model: Hermes-4-14B
    base_url: http://127.0.0.1:8080/v1
    api_key: "no-key-required"

delegation:
  # Subagents route by PROVIDER NAME, not by base_url. That matters: the documented
  # `delegation.base_url` path takes an inline `api_key` and otherwise falls back to
  # OPENAI_API_KEY only — there is no key_env for it — so using it would mean either
  # pasting a token into this file or having children authenticate as the wrong
  # account. Naming the provider resolves its key_env instead.
  provider: "custom:hf-router"
  model: Qwen/Qwen3.6-35B-A3B
  max_concurrent_children: 3
  # Children have their own bucket already; giving them a chain back to NIM would
  # reintroduce exactly the drain this split exists to prevent.
  fallback_providers: []

# ---------------------------------------------------------------------------
# RESEARCH BROWSER
#
# Hermes already has one. `web_search` and `web_extract` are model-callable tools
# with a provider registry, so this is configuration, not construction.
#
# SearXNG is the free half: self-hosted metasearch over 70+ engines, no API key, no
# rate limit, and nothing about your queries leaves your machine except the queries
# themselves. It is SEARCH-ONLY — it implements no extract or crawl — so it is paired
# with Firecrawl, which does extraction well.
#
# Setting search_backend explicitly is load-bearing. Hermes' auto-detection walks a
# priority ladder — Firecrawl > Parallel > Tavily > Exa > SearXNG > Brave > DDGS — so
# merely having FIRECRAWL_API_KEY in the environment silently wins over SearXNG and
# you never find out your "free local search" is billing an API. Naming the backend
# stops that.
#
# Run one:  docker run -d -p 8888:8080 --name searxng searxng/searxng
# Then:     SEARXNG_URL=http://127.0.0.1:8888   in ~/.hermes/.env
#
# With no SEARXNG_URL and no keys at all, Hermes falls to DDGS (DuckDuckGo, keyless).
# Degraded, but the local model is not left without a browser.
# ---------------------------------------------------------------------------
web:
  search_backend: searxng
  extract_backend: firecrawl

# ---------------------------------------------------------------------------
# KEEPING THE PICKER CLEAN
#
# Two separate sources of clutter, and they need two separate fixes.
#
# 1. Live discovery. Each provider above sets `discover_models: false`, so the picker
#    shows the one model configured on that entry rather than everything the endpoint
#    advertises. Listing `models:` alone does not do this — Hermes treats that list as
#    context-length overrides and still probes.
#
# 2. Hermes' own built-in provider catalog, which surfaces independently of anything
#    configured here. `excluded_providers` hides those.
#
# Note `openrouter` in the list below and `or-fallback:` above. The exclusion matches
# case-insensitively against every key a provider can surface under, so had our entry
# kept the name `openrouter` this line would have hidden our own fallback tier along
# with the built-in. Renaming ours is what makes the exclusion safe.
#
# Switching mid-session, with the names as they now stand:
#   /model custom:nvidia-nim:moonshotai/kimi-k3
#   /model custom:hf-router:Qwen/Qwen3.6-35B-A3B
#   /model custom:or-fallback:qwen/qwen3.5-122b-a10b
#   /model custom:local:Hermes-4-14B
# ---------------------------------------------------------------------------
excluded_providers:
  - openrouter
  - anthropic
  - openai
  - copilot
  - google
  - mistral
  - deepseek
  - groq
  - cerebras
  - xai
  - minimax
  - ollama
  - lmstudio
  - nous
