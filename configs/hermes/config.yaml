# Hermes Agent — four providers on four independent rate-limit buckets.
#
# Copy to ~/.hermes/config.yaml (back up whatever is there first), then run
#     scripts/nim-preflight.sh
# before you trust it. The preflight proves the key works, proves traffic lands on
# NVIDIA and not somewhere else, and reports what the endpoint actually supports.
#
# NO KEY GOES IN THIS FILE. Every remote provider reads `key_env`. Put them in
# ~/.hermes/.env (chmod 600) or export them:
#     NVIDIA_API_KEY=nvapi-...      https://build.nvidia.com  -> "Get API Key"
#     HF_TOKEN=hf_...               https://huggingface.co/settings/tokens
#     OPENROUTER_API_KEY=sk-or-v1-...   https://openrouter.ai/keys
#     ANTHROPIC_API_KEY=sk-ant-...  https://console.anthropic.com/settings/keys
#       Optional. Enables `anthropic-direct` (see providers: below), which is NOT
#       wired into any tier by default -- absence changes nothing else. USE A KEY
#       DEDICATED TO THIS PROVIDER, distinct from whatever authenticates Claude
#       Code or any other Anthropic surface on this machine: two consumers on one
#       account is invisible to both of them until a bill or a rate limit says
#       otherwise, which is the exact failure `openai-codex` is excluded below to
#       prevent for ChatGPT. Same shape, different vendor.
# The local tier needs no key at all — it is a server on your own machine.
#
# ---------------------------------------------------------------------------
# THE SHAPE, AND WHY IT CHANGED
#
# This replaces the Kimi-K3 topology. See docs/models/handoff-2026-09-22.md for
# what was actually deployed and how it had drifted; this file is the reconciled
# target, not a record of either side.
#
#   parent      HF router      DeepSeek-V4-Pro           1.6T (49B active), 1M ctx
#   subagents   NVIDIA NIM     Llama-3.3-Nemotron-Super-49B-v1.5  high-compute delegation
#                              (swapped from Nemotron-3-Super-120B-A12B 2026-09-25)
#   fallback    OpenRouter     DeepSeek-V4.1-Flash       552B, 8B/16B active, 1M ctx
#               (+ NVIDIA NIM, same 49B model above, as fallback_providers[0] --
#                see that block's comment)
#   floor       your laptop    Hermes-3-Llama-3.2-3B-abliterated:Q8_0 (Ollama)
#                              support, routing, memory -- swapped from hermes3:8b
#                              2026-09-25, on request
#   vision                     RETIRED as a local tier 2026-09-25 -- reverted to
#                              cloud (or-fallback/DeepSeek-V4.1-Flash). See
#                              auxiliary.vision's comment.
#
# THE VISION-ON-A-SEPARATE-SERVER TIER THAT USED TO SIT HERE IS GONE, retired
# 2026-09-25 along with hermes3:8b and nemotron-nano-12b-v2-vl, on request ("remove
# hermes 8B and the 12b"). The reasoning below is kept because it explains a real
# decision this repo made and later reversed, not because it still describes this
# file -- there is no `local-vl` provider anymore, and nothing here runs llama.cpp.
#
# Importing a VL GGUF plus its separate mmproj projector through an Ollama Modelfile
# has a documented history of failing SILENTLY: in ollama#9967 the projector shows up
# in `ollama show` and image input still errors "this model is missing data required
# for image input". That is the failure mode that mattered -- create succeeds, vision
# is gone. Stated carefully, because the citation was narrower than a blanket claim:
# #9967 is Gemma3 (Mar 2025, closed) and ollama#14730 is qwen35moe (closed as a
# duplicate, root-caused to that architecture's clip runner). Neither established
# that Ollama can NEVER do it, and neither said anything about nemotron_v2_vl -- what
# they established was a real risk of silent capability loss on that exact path,
# which is why this repo ran a second server (llama.cpp) rather than an Ollama tag
# for as long as it carried vision locally at all.
#
# THE INVARIANT IS "a different rate-limit bucket from the parent." It is NOT
# "subagents must avoid NIM" — that was the old rule, and it encoded the old
# topology rather than the requirement. When the parent lived on NIM, children on
# NIM would eat the parent's ~40 RPM. The parent now lives on the HF router, so
# NIM is the children's own bucket and a fan-out there cannot starve the parent.
#
# WHY DEEPSEEK ROUTES THROUGH hf-router AND NOT BY NAME. `deepseek` and
# `openrouter` are both in `excluded_providers` below. `excluded_providers` matches
# case-insensitively against every key a provider can surface under, so naming
# either directly — `provider: deepseek`, or an entry called `openrouter` — would
# be hidden by its own exclusion and silently resolve to the main model. Routing
# through a provider whose NAME is not excluded is what makes this work. The same
# reasoning is why the OpenRouter entry is called `or-fallback`.
#
# VERIFY BEFORE TRUSTING, things this file cannot check:
#   1. That the HF router actually serves `deepseek-ai/DeepSeek-V4-Pro`. It is a
#      1.6T model; the router's coverage at that size is not a given. Run
#      `hermes models list` on the box. If it is absent, move the parent to
#      `or-fallback` — also exclusion-safe — rather than renaming a provider.
#   2. That Ollama has actually pulled
#      `hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0` (see the
#      `local` provider's comment for the pull command). A model listed here but
#      absent on the machine is exactly the dangling reference CI rejects in
#      config and cannot detect on disk. scripts/hermes-verify.ps1 checks this.
# ---------------------------------------------------------------------------

providers:

  hf-router:
    name: "Hugging Face Inference Providers"
    # OpenAI-compatible router in front of every HF inference provider. The parent
    # tier, and a separate rate-limit bucket from NIM.
    api: https://router.huggingface.co/v1
    key_env: HF_TOKEN
    transport: chat_completions
    # Bare id lets HF pick the provider. Pin one by suffixing it, or use `:fastest`
    # to let HF route on latency.
    default_model: deepseek-ai/DeepSeek-V4-Pro
    models:
      - deepseek-ai/DeepSeek-V4-Pro
    # Pin the picker to the line above. Without this Hermes live-probes the
    # endpoint's /models and a `models:` list alone does NOT whitelist — the
    # HF router and OpenRouter each return hundreds.
    discover_models: false
    # DeepSeek-V4-Pro: 1.6T total, 49B active, MoE, MIT licence, one-million-token
    # context. Hybrid attention (CSA + HCA) puts 1M-context inference at ~27% of
    # V3.2's per-token FLOPs and ~10% of its KV cache.
    #
    # Set FAR below the architectural million on purpose. The router serves a
    # smaller window than the model supports, and overstating it makes Hermes pack
    # context it will get a 400 back for. Raise it to whatever the endpoint
    # actually advertises, not to what the model card claims.
    context_length: 262144

  nvidia-nim:
    name: "NVIDIA NIM (build.nvidia.com)"
    api: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    transport: chat_completions
    # SWAPPED 2026-09-25, on request: "we moved to the 49 billion Nemotron,
    # remove the 120 billion." Nemotron-3-Super-120B-A12B is gone from this file
    # entirely as of this change -- it no longer serves subagents/delegation or
    # the MoA aggregator (both updated below), and nothing here references it.
    #
    # The 2026-09-22 "verified against the live endpoint" claim that used to sit
    # here was true of the 120B id and does NOT carry over to this one. This id,
    # nvidia/llama-3.3-nemotron-super-49b-v1.5, was NOT live-verified from this
    # sandbox -- build.nvidia.com and docs.api.nvidia.com are both blocked by
    # this environment's egress proxy. It is triangulated against three
    # independent NIM resellers instead (Puter, WaveSpeedAI, AIMLAPI), all
    # showing the identical string -- see fallback_providers[0] below, which
    # carries the full writeup for the same id. Confirm for real before
    # trusting either use of it:
    #     bash scripts/nim-preflight.sh --list | grep -i nemotron-super-49b
    default_model: nvidia/llama-3.3-nemotron-super-49b-v1.5
    models:
      - nvidia/llama-3.3-nemotron-super-49b-v1.5
    discover_models: false
    # nim-preflight.sh reports what the endpoint advertises. Set this to the number
    # it prints. The preflight now defaults to the model above; NVIDIA_NIM_MODEL
    # overrides it if you need to probe a different one.
    #
    # 128K per the model card ("The model supports a context length of 128K
    # tokens"). Same figure as the 120B entry this replaced, so the number below
    # is unchanged even though the model is not.
    context_length: 131072

  or-fallback:
    name: "OpenRouter"
    api: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    transport: chat_completions
    # Third bucket: the 429 escape hatch, AND the workhorse for the two heavy
    # auxiliary slots. Both jobs land on one model on purpose.
    #
    # This tier used to run Qwen3.5-122B-A10B. Replacing it with a DeepSeek keeps
    # the whole cloud stack in ONE family -- one tokenizer, one chat template, one
    # tool-call convention across parent, fallback and auxiliaries. It also makes
    # failover stop being a trade: the old comment here had to explain what you
    # gained and lost when the fallback fired. Now you lose nothing but latency.
    #
    # DeepSeek-V4.1-Flash, from its model card (Sep 2026, MIT):
    #   552B backbone, MoE, multimodal -- takes images and text natively
    #   1,000,000-token context
    #   Causal Encoder-Decoder: 40 layers as a 20-layer causal encoder + 20-layer
    #     decoder. The decoder's global KV is projected from the FINAL encoder
    #     hidden states rather than per-decoder-layer, so it activates only
    #     8B parameters per token on prefill and 16B on decode.
    #   SWA Bounded Replay cuts persistent KV cache to ~1/8 of DeepSeek-V4-Flash.
    #
    # That prefill number is why this model suits this slot specifically. The card
    # names "input-heavy agentic workloads" as the target, and compression and
    # web_extract are exactly that shape: a large context in, a short summary out.
    # Paying 8B-active on the input half is the whole cost of those slots.
    #
    # NO BENCHMARK FIGURES ARE QUOTED HERE. The previous entry carried measured
    # numbers (BFCL-V4, MMMU-Pro) for a DIFFERENT model; they were deleted rather
    # than carried across, because a benchmark belongs to the model it was run on.
    #
    # THE ID BELOW IS OPENROUTER'S, NOT HUGGING FACE'S. Do not "correct" it to
    # match the model card. Same model, two namespaces:
    #
    #   Hugging Face   deepseek-ai/DeepSeek-V4.1-Flash    <- the hf-router form
    #   OpenRouter     deepseek/deepseek-v4.1-flash       <- what THIS tier sends
    #
    # This entry carried the Hugging Face form for its whole life. OpenRouter serves
    # nothing under that name, and `discover_models: false` means Hermes never
    # probes /models to find out -- it sends the id and takes the 404. Four things
    # died with it and none of them errored visibly: the 429 escape hatch,
    # `compression` (which REWRITES conversation history), `web_extract`, and
    # `vision` -- the slot that was repaired in the same change that shipped this.
    #
    # The parent's id two providers up is DIFFERENT ON PURPOSE: the HF router
    # really does take the Hugging Face form. The rule is not "use lowercase", it
    # is "each gateway names models in its own namespace" -- so an id copied from
    # one provider to another is wrong by default, and this is the proof.
    default_model: deepseek/deepseek-v4.1-flash
    models:
      - deepseek/deepseek-v4.1-flash
    discover_models: false
    # Held at the parent's window rather than the architectural million, for the
    # same reason: raise it to what the endpoint advertises, not the model card.
    context_length: 262144

  local:
    name: "Ollama (this machine)"
    # Ollama's OpenAI-compatible endpoint. `ollama serve` -> 11434.
    # Note this provider is named `local`, NOT `ollama`: `ollama` is in
    # excluded_providers below to hide the built-in catalog entry, and a provider
    # named the same as its own exclusion hides itself.
    api: http://127.0.0.1:11434/v1
    # Loopback only. No key_env because there is no key: a server on your own
    # machine authenticates nothing. The CI check that forbids inline keys exempts
    # loopback hosts for exactly this reason.
    api_key: "no-key-required"
    transport: chat_completions
    # SWAPPED 2026-09-25, on request: "remove hermes 8B and the 12b [...] to the
    # local hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0 [...]
    # inference setup will be handled by Hermes." hermes3:8b is gone from this
    # file entirely, replaced by a single, smaller local model -- Q8_0, verified
    # live against the Hugging Face repo on 2026-09-25 at 3,421,895,840 bytes
    # (~3.42 GB), matching the "3.4 GB" the request named.
    #
    # PULLED VIA OLLAMA'S OWN HF-DIRECT FEATURE, not a manual GGUF download+
    # Modelfile the way earlier local models in this file needed:
    #     ollama pull hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    # The full string becomes the model's tag in `ollama list` and is exactly
    # what belongs in `default_model`/`models:` below -- Ollama does not rename
    # it. Needs a reasonably current Ollama (the hf.co/ pull path); check
    # `ollama --version` if the pull is rejected. No llama.cpp, no --mmproj, no
    # second local service: this is a normal Ollama tag like hermes3:8b was.
    #
    # "ABLITERATED" IS A REAL BEHAVIOR CHANGE, NOT A BRANDING DETAIL. This is a
    # refusal-removed fine-tune -- its safety training was deliberately ablated.
    # That is now the model backing every local-routed auxiliary slot below,
    # `auxiliary.approval` included. Worth knowing before assuming "smaller
    # model" is the only thing that changed.
    #
    # It is also the auxiliary workhorse (see `auxiliary:` below) -- routing,
    # classification, short structured output, tool selection -- the same role
    # hermes3:8b held, on a smaller model now.
    default_model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    models:
      - hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    discover_models: false
    # `local-vl` (nemotron-nano-12b-v2-vl on llama.cpp :8080) is REMOVED, not just
    # unrouted -- the 120-line rationale that used to live here for why heavy
    # local work needed a second server is gone with it. `auxiliary.vision`
    # reverted to the cloud route it used before that tier existed; see its own
    # comment below for why and the exact history. Llama-3.2-3B is text-only
    # (Llama 3.2's vision variants are the 11B/90B line, not 1B/3B) -- it was
    # never a vision-capable replacement, so this is a real capability loss for
    # local/offline vision, accepted on request, not something this swap papers
    # over.
    #
    # KV cache is what hurts on a laptop, not the weights, so this sits far below
    # the model's native window. Raise it only as far as RAM tolerates -- and
    # note there is more room now than hermes3:8b left, since the weights
    # themselves are smaller (3.4 GB vs. hermes3:8b's ~4.7 GB Q4 tag).
    context_length: 32768

  anthropic-direct:
    name: "Anthropic (OpenAI-compatible endpoint)"
    #
    # NOT WIRED INTO ANY TIER. Added available-but-unassigned, on request, on
    # 2026-09-25. No parent, delegation, fallback, MoA or auxiliary slot points
    # here. Reachable only via `/model custom:anthropic-direct:claude-sonnet-5`.
    # Wiring it into a role is a separate, deliberate edit -- see the MoA
    # aggregator comment below for why it was kept out of that slot specifically.
    #
    # THIS ROUTES THROUGH ANTHROPIC'S OWN OPENAI-COMPATIBLE ENDPOINT, not a
    # third-party proxy and not the native Messages API. Anthropic ships a
    # `/v1/chat/completions` surface built for exactly this transport, alongside
    # the native `/v1/messages` used by the Anthropic SDKs.
    #
    # VERIFIED LIVE 2026-09-25, not assumed from training data -- this repo's own
    # standard after the or-fallback model-id incident. Two no-credential probes
    # against the real endpoint, no real key ever sent:
    #   1. POST /v1/chat/completions, no auth header at all -> 401 with an
    #      OpenAI-shaped error body ({"error":{"code":...,"type":
    #      "invalid_request_error"}}). A garbage `Authorization: Bearer` token
    #      produces the SAME shape (still "invalid", not "missing header") --
    #      confirming the endpoint reads Bearer auth and answers in OpenAI's
    #      error schema, which is what this file's `chat_completions` transport
    #      needs from every provider it talks to.
    #   2. The SAME garbage token against `x-api-key` on the same path returns a
    #      DIFFERENT error shape ({"type":"error","error":{"type":
    #      "authentication_error", ...}}) -- Anthropic's native format. The
    #      endpoint auto-detects which header style you used and replies in the
    #      matching schema, which only a real compatibility shim does.
    #   3. For comparison, POST /v1/messages (the real native endpoint) with no
    #      auth returned "x-api-key header is required" -- a third, distinct
    #      response, proving /chat/completions is not just an alias of it.
    #
    # NOT VERIFIED, AND THE GAP IS REAL: GET /v1/models on this same host
    # answered a Bearer token with "invalid x-api-key" -- the completions path
    # accepts Bearer, the Models API does not. hermes-verify.ps1's catalog probe
    # is patched for this one provider (`-CatalogAuthHeader x-api-key`) because
    # of that finding; do not remove the override without re-testing this split.
    # Whether a REAL key's completion actually returns claude-sonnet-5 content
    # was never tested here -- no real credential exists in this environment, and
    # this file does not invent one. `hermes-verify.ps1 -Deep` is what closes
    # that gap, the same way it already does for the other three tiers.
    api: https://api.anthropic.com/v1
    key_env: ANTHROPIC_API_KEY
    transport: chat_completions
    default_model: claude-sonnet-5
    models:
      - claude-sonnet-5
    # Pin the picker to the line above, matching every other entry in this file.
    discover_models: false
    # From the claude-api skill's live model table (cached 2026-06-24, re-checked
    # 2026-09-25): 1,000,000-token context, $2.00 / $10.00 per MTok in / out.
    # Held below the architectural ceiling for the same reason hf-router is:
    # this compat SHIM's own per-request window was never measured against a
    # real key, so raise this only once `-Deep` confirms what it actually serves.
    context_length: 200000

model:
  # Named-provider form. Routes by provider key rather than by model-name
  # detection — the detection path has an open bug where a model name matching
  # the OpenRouter catalog overrides an explicit custom base_url and sends your
  # key to a third party.
  provider: "custom:hf-router"
  default: deepseek-ai/DeepSeek-V4-Pro
  temperature: 1.0
  top_p: 1.0

fallback_providers:
  # A 429 or an outage on the parent falls through to a different provider rather
  # than stopping.
  #
  # FALLBACK 1 -- added 2026-09-25, on request. NVIDIA NIM, cloud-hosted. This is
  # NOT the laptop: an Unsloth UD-Q8_K_XL GGUF of this same model family was
  # downloaded locally first, then explicitly redirected here once the target
  # turned out to be a cloud box, not the laptop the `local` tier runs on. That
  # download is UNCONNECTED to how this entry actually serves -- NIM
  # serves its own hosted build of the model; it does not take an uploaded GGUF.
  #
  # MODEL ID NOT LIVE-VERIFIED FROM THIS REPO'S SANDBOX. build.nvidia.com and
  # docs.api.nvidia.com are both blocked by this environment's egress proxy, so
  # this could not be checked live the way the `nvidia-nim` provider's own entry
  # above was (see its "Verified against the live endpoint" comment). The id
  # below is corroborated by THREE independent resellers proxying NVIDIA's NIM
  # catalog (Puter, WaveSpeedAI, AIMLAPI), all showing the identical string in
  # their curl examples -- triangulated, not first-party. Confirm it for real
  # before trusting this tier:
  #     bash scripts/nim-preflight.sh --list | grep -i nemotron-super-49b
  # nim-preflight's --list prints every model id this NVIDIA_API_KEY can reach,
  # scoped to your account -- the same self-verification nim-preflight.sh already
  # gives every other NIM id in this file, so no new tooling is needed for this.
  #
  # SAME BUCKET AS `nvidia-nim` ABOVE, ON PURPOSE OR NOT -- WORTH KNOWING EITHER
  # WAY. This entry reuses NVIDIA_API_KEY and build.nvidia.com, the identical
  # rate-limit bucket `delegation:` already spends on subagents. A fallback
  # firing here now competes with in-flight subagent calls for the same ~40 RPM,
  # where the parent's OWN fallback (the DeepSeek entry just below) sits on a
  # bucket nothing else touches. If that trade is unwanted, move this to its own
  # credential or accept that a bad subagent fan-out can starve this fallback too.
  #
  # SAME MODEL AS `nvidia-nim` ABOVE, TOO, since the 120B->49B swap (2026-09-25) --
  # not just the same bucket. A NIM outage now takes out subagent capacity AND
  # this fallback link simultaneously; this entry still isn't pointless, since it
  # answers a DIFFERENT failure (the parent, hf-router, going down) than
  # delegation does, but the two roles no longer diversify away from each other
  # the way they did when they ran different model sizes.
  - provider: custom
    model: nvidia/llama-3.3-nemotron-super-49b-v1.5
    base_url: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
  # FALLBACK 2 (was fallback 1 until the entry above was added 2026-09-25).
  # Unchanged in content -- only its position in the chain shifted.
  - provider: custom
    model: deepseek/deepseek-v4.1-flash
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
  # Last resort, and the only entry that survives losing the network. Much smaller
  # than anything above it; nothing can rate-limit it. Swapped from hermes3:8b to
  # the same local model the `local` provider now runs, 2026-09-25.
  - provider: custom
    model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    base_url: http://127.0.0.1:11434/v1
    api_key: "no-key-required"

delegation:
  # Subagents route by PROVIDER NAME, not by base_url. The documented
  # `delegation.base_url` path takes an inline `api_key` and otherwise falls back
  # to OPENAI_API_KEY only — there is no key_env for it — so using it would mean
  # either pasting a token into this file or having children authenticate as the
  # wrong account. Naming the provider resolves its key_env instead.
  #
  # NIM is the children's bucket, not the parent's. Llama-3.3-Nemotron-Super-49B-v1.5
  # is the high-compute tier (swapped from Nemotron-3-Super-120B-A12B 2026-09-25,
  # on request): expensive reasoning and multi-agent decomposition, which is what
  # delegation is for -- and the model card names exactly that ("post-trained for
  # reasoning ... and agentic tasks, such as RAG and tool calling"), which the
  # 120B entry this replaced was never specifically documented as.
  provider: "custom:nvidia-nim"
  model: nvidia/llama-3.3-nemotron-super-49b-v1.5
  max_concurrent_children: 3
  # Children have their own bucket already. A chain back to the parent's provider
  # would reintroduce exactly the drain this split exists to prevent.
  fallback_providers: []

# ---------------------------------------------------------------------------
# MIXTURE OF AGENTS
#
# MoA costs AT LEAST two inference calls per turn: every reference model, then the
# aggregator. This config's whole thesis is that requests are the scarce resource,
# so the pool is kept to ONE reference model rather than the three or four MoA
# implementations usually show.
#
# Reference and aggregator sit on DIFFERENT providers on purpose. Same-provider
# MoA spends one bucket twice per turn and, worse, asks one model family to check
# its own work — which is most of what MoA is supposed to prevent.
# ---------------------------------------------------------------------------
moa:
  reference_models:
    - provider: "custom:hf-router"
      model: deepseek-ai/DeepSeek-V4-Pro
      enabled: true
  aggregator:
    # DELIBERATELY NOT anthropic-direct, EVEN THOUGH IT NOW EXISTS.
    #
    # This comment used to say Claude was "not inside the Hermes routing table."
    # That stopped being true the moment `anthropic-direct` was added -- Claude
    # Sonnet 5 IS reachable from Hermes now, on request, via /model. This slot
    # still does not use it, and the ORIGINAL reasoning still holds on its own
    # terms, so it is restated rather than deleted:
    #
    #   cost — every MoA turn would carry a metered $2/$10-per-MTok call on top
    #   of whatever the reference model already costs, on a config whose whole
    #   thesis is that requests (not money) are the scarce resource for the rest
    #   of the stack. That thesis does not apply to a metered API tier the same
    #   way, which is exactly why this tier was kept OUT of anything automatic.
    #
    #   self-grading — the reference pool is DeepSeek-V4-Pro. Aggregating with
    #   another frontier model from a DIFFERENT family is closer to what MoA is
    #   for than aggregating with more of the same family would be, so Claude
    #   is not a bad technical fit here. That is a reason it COULD move here
    #   later, not a reason it silently did.
    #
    # If you want Claude as the aggregator, that is a one-line, deliberate edit
    # (provider: "custom:anthropic-direct", model: claude-sonnet-5) — not this
    # comment's job to make for you.
    provider: "custom:nvidia-nim"
    model: nvidia/llama-3.3-nemotron-super-49b-v1.5
  presets:
    default:
      reference_models:
        - provider: "custom:hf-router"
          model: deepseek-ai/DeepSeek-V4-Pro
          enabled: true

# ---------------------------------------------------------------------------
# RESEARCH BROWSER
#
# SearXNG is the free half: self-hosted metasearch over 70+ engines, no API key,
# no rate limit. It is SEARCH-ONLY — no extract, no crawl — so it is paired with
# an extractor.
#
# Setting search_backend explicitly is load-bearing. Hermes' auto-detection walks
# Firecrawl > Parallel > Tavily > Exa > SearXNG > Brave > DDGS, so merely having
# FIRECRAWL_API_KEY in the environment silently wins over SearXNG and you never
# find out your "free local search" is billing an API.
#
# Run one:  docker run -d -p 8888:8080 --name searxng searxng/searxng
# Then:     SEARXNG_URL=http://127.0.0.1:8888   in ~/.hermes/.env
# ---------------------------------------------------------------------------
web:
  search_backend: searxng
  extract_backend: firecrawl

# ---------------------------------------------------------------------------
# KEEPING THE PICKER CLEAN
#
# 1. Live discovery. Every provider sets `discover_models: false`, so the picker
#    shows the models configured on that entry rather than everything the endpoint
#    advertises. Listing `models:` alone does not do this.
# 2. Hermes' built-in provider catalog, which surfaces independently of anything
#    configured here. `excluded_providers` hides those.
#
# Three names below are load-bearing rather than cosmetic. `openrouter`,
# `deepseek` and `ollama` are all excluded, and all three are things this config
# actually uses — through providers named `or-fallback`, `hf-router` and `local`.
# That indirection is the point: exclusion matches every key a provider surfaces
# under, so an entry named after its own exclusion would hide itself.
#
# `openai-codex` is excluded for a different reason than the rest. It is not
# clutter — it is a working provider (ChatGPT/Codex OAuth) that must never be
# turned on here. Hermes also delegates coding tasks to the Codex CLI as a
# subprocess (docs/models/codex-handoff.md), and that CLI reads its own OAuth
# token from ~/.codex/auth.json against the SAME ChatGPT 5-hour usage window this
# provider would draw from ~/.hermes/auth.json. Two consumers of one quota,
# invisible to each other. CI asserts this entry stays present.
#
# Switching mid-session, with the names as they now stand:
#   /model custom:hf-router:deepseek-ai/DeepSeek-V4-Pro
#   /model custom:nvidia-nim:nvidia/llama-3.3-nemotron-super-49b-v1.5
#   /model custom:or-fallback:deepseek/deepseek-v4.1-flash
#   /model custom:local:hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
#   /model custom:anthropic-direct:claude-sonnet-5       (needs ANTHROPIC_API_KEY)
# ---------------------------------------------------------------------------
excluded_providers:
  # EXACT LOWERCASE SET MATCH, NOT SUBSTRING. Verified in the hermes-agent source
  # 2026-09-23: hermes_cli/model_switch_providers.py builds
  # `excluded={str(p).strip().lower() for p in excluded_providers}`. So `google` does
  # NOT cover `gemini`, and `openai-codex` does NOT cover `codex`. Every alias has to
  # be listed by name.
  #
  # THIS LIST WAS SHORT BY SEVEN NAMES until that check was run. The source defines
  # _GEMINI_NATIVE_PROVIDER_NAMES = {"gemini", "google", "google-gemini",
  # "google-ai-studio"} and _GOOGLE_PROVIDER_NAMES adds {"vertex", "google-vertex",
  # "vertex-ai"} -- only one of those seven was excluded. Separately,
  # _VISION_AUTO_PROVIDER_ORDER = ("openrouter", "nous", "deepinfra") names deepinfra
  # as a provider auxiliary VISION can auto-select, and it was not excluded either.
  #
  # Listing a name that is already covered costs nothing. Missing one puts a model in
  # the picker that no tier owns, on a bucket nothing here accounts for.
  - openrouter
  - anthropic
  - openai
  - openai-codex
  - codex
  - copilot
  - google
  - gemini
  - google-gemini
  - google-ai-studio
  - vertex
  - google-vertex
  - vertex-ai
  - mistral
  - deepseek
  - groq
  - cerebras
  - xai
  - minimax
  - ollama
  - lmstudio
  - nous
  - deepinfra
  - bedrock
  - together
  - fireworks
  - perplexity
  - moonshot
  - qwen
  - cohere
  - novita
  - nebius
  - azure

# ---------------------------------------------------------------------------
# VOICE — jamiepine/hermes-voicebox
#
# IT IS A BRIDGE, NOT AN ENGINE. The plugin talks to the Voicebox app, which has
# to be running locally — desktop build on :17493, Docker on :17600. Installing
# the plugin alone does nothing, which is the easiest way to be confused by it.
#
#   pip install hermes-voicebox        # into the env Hermes runs in
# ---------------------------------------------------------------------------
tts:
  provider: voicebox

stt:
  provider: voicebox

# ---------------------------------------------------------------------------
# MCP — TOOL-FILTERED, AND MOSTLY LOCAL
#
# Hermes reads MCP servers from HERE, not from `.mcp.json` (that file is Claude
# Code's).
#
# `tools.include` is the part that matters for throughput. Every MCP tool Hermes
# discovers is injected into the system prompt on EVERY request. An unfiltered
# server with 40 tools is a permanent tax on every bucket at once. Name only what
# you call. `hermes mcp configure <name>` reopens the checklist to widen it later.
#
# TWO HOSTED SERVERS ARE ALLOWED HERE, and they are the exception rather than the
# rule. CI enforces an explicit allowlist (`cloudflare`, `submcp`) instead of the
# blanket loopback-only rule it used to apply: a hosted MCP costs a round trip per
# call and prompt space on every request, so each one has to be named in CI on
# purpose rather than added by drift. Everything not on that list must still be
# loopback or a local subprocess.
#
# `render` is deliberately ABSENT. Its endpoint (mcp.render.com) failed DNS
# repeatedly, and the config it was configured in carried an INLINE bearer token.
# Rotate that token in the Render dashboard before re-adding this entry, and read
# it from the environment when you do.
# ---------------------------------------------------------------------------
mcp_servers:
  # Voicebox's own MCP server, for agent-invoked voice tools rather than Hermes'
  # tts/stt plumbing. Loopback, no key.
  voicebox:
    url: "http://127.0.0.1:17493/mcp"
    tools:
      # Explicitly unfiltered. Voicebox has never been started in this
      # environment, so its tool names are unknown here and a guessed
      # include-list would filter everything out and silently break voice. Run
      # it, then `hermes mcp configure voicebox` and replace this with the real
      # list. The flag exists so CI can tell a reviewed opt-out from an
      # unnoticed one.
      unfiltered: true

  # Self-hosted extraction. Pairs with `web.extract_backend`: SearXNG searches,
  # Crawl4AI reads. Keyless, loopback, and unlike Firecrawl it never leaves the
  # machine.
  crawl4ai:
    url: "http://127.0.0.1:11235/mcp/sse"
    tools:
      include:
        - crawl
        - scrape

  # Cross-session recall. Reviewed: telemetryCollection is declared, defaulted
  # and never read — it gates no network call.
  atomicmemory:
    command: "npx"
    args: ["-y", "@atomicmemory/mcp-server"]
    tools:
      include:
        - store_memory
        - search_memory
        - list_memories

  # The packaged Hermes/Codex skills server. Local subprocess, no network.
  # Set HERMES_SKILLS_SERVER to the built entrypoint — on the 2026-09-22 Windows
  # box that is %LOCALAPPDATA%\hermes\skills-mcp-server\dist\index.js. Do not
  # hardcode a per-machine path in a file that gets copied between machines.
  hermes-skills:
    command: "node"
    args: ["${HERMES_SKILLS_SERVER}"]
    tools:
      include:
        - list_skills
        - get_skill
        - search_skills

  # Multi-perspective review. Local subprocess.
  #
  # ROOT CAUSE CORRECTED 2026-09-22, AND THE CORRECTION IS THE POINT.
  #
  # This entry used to name a Python interpreter directly, and the Hermes
  # supervisor SUBSTITUTED ITS OWN BUNDLED PYTHON when launching it. The symptom:
  #     ModuleNotFoundError: No module named 'mcp.server.fastmcp'
  # which reads as a dependency fault and is not one. hermes_council imports
  # cleanly under the interpreter it was installed into -- verified on the box.
  # The supervisor was simply running a different Python than the one holding
  # the packages.
  #
  # An earlier revision of this file diagnosed it as an MCP SDK version mismatch
  # and told the reader to reconcile package versions in the venv. That was
  # WRONG, and it sent debugging one layer below where the fault lived. It is
  # recorded here rather than quietly deleted because the wrong answer was
  # entirely plausible: the error names a module, so a missing module is the
  # obvious inference, and it is the wrong one.
  #
  # The fix is indirection the supervisor cannot reach through. `command` names a
  # LAUNCHER; the launcher pins the absolute interpreter internally. Whatever the
  # supervisor resolves for `command`, it cannot reach inside the launcher to
  # swap what that launcher itself executes. scripts/hermes-council-launch.cmd
  # refuses to run rather than guess an interpreter -- a silent fallback is the
  # whole bug class.
  #
  # THE SAME EXPOSURE APPLIES TO EVERY `command:` ENTRY BELOW AND ABOVE.
  # atomicmemory (npx) and hermes-skills (node) are the other two. A substituted
  # Node fails the same way and just as misleadingly. The `url:` entries --
  # voicebox, crawl4ai, and the two hosted servers -- are immune, because the
  # supervisor connects to them rather than launching them.
  hermes-council:
    command: "${HERMES_COUNCIL_LAUNCHER}"
    args: []
    tools:
      include:
        - council_review
        - council_perspectives

  # Codex, as TOOLS rather than as a shell string.
  #
  # `codex mcp list` reports Unsupported and always will: Codex 0.154.0 removed the
  # mcp-server entry point on 2026-09-05 and Codex is an MCP CLIENT now. This is the
  # interface rebuilt locally -- scripts/codex-mcp/server.js, dependency-free, talking
  # newline-delimited JSON-RPC over stdio.
  #
  # It does NOT make Codex an inference provider. `openai-codex` stays excluded below,
  # because that provider and the CLI draw on the same ChatGPT 5-hour window from two
  # different token files. This wraps the subprocess the bundled skill already drives;
  # it adds no second consumer of that quota.
  #
  # LAUNCHER, not a bare `node`, for the reason spelled out on hermes-council: the
  # supervisor substitutes its own runtime for a `command:` entry, and a substituted
  # Node fails exactly as misleadingly as the substituted Python did. Set
  # HERMES_CODEX_LAUNCHER to scripts\codex-mcp-launch.cmd and HERMES_CODEX_NODE to the
  # node.exe it should pin; the launcher refuses rather than guessing.
  codex-mcp:
    command: "${HERMES_CODEX_LAUNCHER}"
    args: []
    tools:
      include:
        - codex_exec
        - codex_status

  # HOSTED — allowlisted. Every call is a round trip off-box.
  cloudflare:
    url: "https://mcp.cloudflare.com/mcp"
    tools:
      include:
        - workers_list
        - workers_get
        - kv_list

  # HOSTED — allowlisted. Sub-agent MCP aggregator.
  submcp:
    url: "https://mcp.submcp.com/mcp"
    tools:
      unfiltered: true

# ---------------------------------------------------------------------------
# THROUGHPUT — everything below exists to buy requests, not to save money
# ---------------------------------------------------------------------------

# AUXILIARY MODELS — the largest single win across all three constraints.
#
# Hermes has TWO kinds of model slot. The main model is what it thinks with.
# Auxiliary models are eleven side-jobs it offloads: context compression, vision,
# web-page summarisation, approval scoring, MCP tool routing, session titles,
# skill search, curator review, and the Kanban trio.
#
# EVERY auxiliary slot defaults to `auto`, and `auto` means "use the main model."
# Left alone, a 1.6T model at 1M context writes your session titles, on the
# parent's own bucket, competing with the conversation for it.
#
# THE SPLIT BELOW IS NOT UNIFORM, and the reason matters.
#
# The local model (Hermes-3-Llama-3.2-3B-abliterated:Q8_0, swapped from
# hermes3:8b 2026-09-25 -- local, free, unmetered, no rate limit either way)
# takes the slots a small model is genuinely strong at: routing, classification,
# tool selection, short structured output. That is five of the seven, and it
# costs nothing at any volume.
#
# compression and web_extract do NOT go there. Both are long-form summarisation,
# and compression in particular REWRITES conversation history — a bad compaction
# is unrecoverable and silently degrades everything after it. Summarising a
# 262k-token context down to 20% is not a job for a model this size. Those two go
# to or-fallback, which is a third bucket, so they compete with neither the
# parent nor the subagents.
#
# Left on `auto` deliberately: the three Kanban slots (unused — no board
# configured). Vision is PINNED, not auto -- see its own comment below for why
# `auto` is unsafe here specifically.
auxiliary:
  compression:
    provider: "custom:or-fallback"
    model: deepseek/deepseek-v4.1-flash
  web_extract:
    provider: "custom:or-fallback"
    model: deepseek/deepseek-v4.1-flash
  # VISION: MOVED TO NVIDIA NIM 2026-09-27, on request -- a purpose-built
  # vision-language model on the SAME provider/key subagents and fallback 1
  # already use, rather than DeepSeek-V4.1-Flash doing vision as a side
  # capability. nvidia/ising-calibration-1.5-31b is an NVIDIA-authored
  # image-text-to-text model; its NIM API example (integrate.api.nvidia.com,
  # OpenAI-style `messages[].content` with `image_url` + `text` blocks) was
  # pulled directly from its build.nvidia.com product page, not fabricated --
  # but like the 49B id above, build.nvidia.com is egress-blocked from this
  # sandbox, so it was NOT live-tested from here. Self-verify before trusting:
  #     bash scripts/nim-preflight.sh --list | grep -i ising-calibration
  #
  # HISTORY, kept because the reasoning still applies to any future vision
  # choice here: this slot was on `auto` back when the parent was Kimi-K3
  # (which had vision). The parent became DeepSeek-V4-Pro, text-only -- no
  # image path -- and `auto` silently resolved image work to a model that
  # could not see, reported as a bad answer rather than a missing capability.
  # The local floor model is ALSO text-only (Llama 3.2's vision variants are
  # the 11B/90B line, not the 3B this repo runs). So this stays pinned
  # explicitly, never `auto`.
  #
  # Before this: DeepSeek-V4.1-Flash on `custom:or-fallback` (2026-09-25 -
  # 2026-09-27), itself a revert from the retired `local-vl` tier
  # (nemotron-nano-12b-v2-vl on llama.cpp :8080). Both this and that one are
  # cloud-only -- moving providers does not reintroduce the offline capability
  # local-VL had; vision still fails the way the other cloud tiers do, on no
  # network.
  vision:
    provider: "custom:nvidia-nim"
    model: nvidia/ising-calibration-1.5-31b
  title_generation:
    provider: "custom:local"
    model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
    prefer_fast_model: true
  approval:
    provider: "custom:local"
    model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
  mcp:
    provider: "custom:local"
    model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
  skills_hub:
    provider: "custom:local"
    model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0
  curator:
    provider: "custom:local"
    model: hf.co/mradermacher/Hermes-3-Llama-3.2-3B-abliterated-GGUF:Q8_0

# execute_code — the single largest win available.
#
# The agent writes a Python script that calls Hermes tools over an RPC socket.
# Intermediate tool results NEVER enter the context window; only the script's
# final print() comes back. A search -> extract -> filter -> summarise pipeline
# that costs four inference round trips collapses into ONE.
#
# `project` mode runs in the session's working directory with the active venv, so
# `import pandas` and relative paths behave as they do in terminal(). `strict`
# quarantines to a temp dir with Hermes' own interpreter — more reproducible, less
# useful. Security is identical either way: credentials are scrubbed, and scripts
# cannot call execute_code recursively, delegate_task, or any MCP tool.
code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50

# Compression — threshold RAISED, which is the counter-intuitive half.
#
# Default is 0.50: compact once the context passes half the window. Raising it
# wins on ALL THREE constraints at once:
#
#   requests — every compaction is itself an inference call
#   money    — compaction REWRITES history, so it invalidates the provider prompt
#              cache. The next request re-reads the whole conversation at full
#              input price instead of the cached rate, which Hermes' own docs put
#              at a 75-90% discount.
#   tokens   — that re-read is the single largest token event in a session
#
# The naive reading is "compact early to save tokens." It is wrong: compacting
# early spends a request and destroys the cache to shrink a context that was being
# billed at a tenth of the price.
#
# 0.70 on a 262k window is ~183k tokens before the first compaction — still far
# short of overflow. Do NOT raise it much further: provider-proven overflow costs
# a rejected request plus a bounded recovery pass, which is worse than the
# compaction it avoided.
#
# The key is a SUBSTRING match against the model id, longest key wins.
compression:
  enabled: true
  threshold: 0.50          # global default, unchanged
  model_thresholds:
    "DeepSeek-V4-Pro": 0.70
  target_ratio: 0.20
  tail_mode: lean
  protect_last_n: 20

context:
  engine: "compressor"     # built-in. Pinned so a plugin cannot silently take over.

# Credential pools — same-provider key rotation.
#
# A pool registers several keys for ONE provider and rotates on 429/402/401
# instead of failing over to a different provider. Pools are tried BEFORE
# fallback_providers, so a second key keeps the tier serving where today a 429
# drops it a level.
#
#     hermes auth add hf-router --api-key hf_<second key>
#     hermes auth list
#
# STRATEGY: fill_first, deliberately — NOT round_robin.
#
# Provider prompt caches are scoped per API key. Rotating keys mid-session throws
# the cached prefix away and the next request re-reads the whole conversation at
# undiscounted input price. round_robin rotates on EVERY selection and would pay
# that constantly. fill_first uses one key until it is genuinely exhausted — one
# cache reset per exhaustion, not one per request.
credential_pool_strategies:
  hf-router: fill_first
  nvidia-nim: fill_first
  or-fallback: fill_first

# Provider routing — OpenRouter ONLY. No effect on NIM, HF or the local floor, so
# it shapes exactly one tier: `or-fallback`, which serves both the 429 escape and
# the two heavy auxiliary slots.
#
# sort: throughput because we reach that tier when something upstream is already
# slow or refusing. require_parameters so a reseller that silently drops `tools`
# or `temperature` is never selected — a fallback that quietly loses tool-calling
# is worse than the 429 it replaced.
provider_routing:
  sort: "throughput"
  require_parameters: true
  data_collection: "deny"

# ---------------------------------------------------------------------------
# PROMPT CACHING
#
# Added 2026-09-23 after diffing this file against upstream's 2267-line
# cli-config.yaml.example. This build was using 16 of the 25 top-level keys the
# reference documents; the nine it was not using were not decisions, they were
# things nobody had read. Every key below was verified present in the hermes-agent
# source before being written here -- `prompt_caching` and `cache_ttl` resolve in 14
# and 11 source files respectively -- because a config key that nothing reads is the
# exact silent failure this build keeps paying for.
#
# WHY "1h" AND NOT THE "5m" DEFAULT. The upstream comment says to use 1h "for long
# sessions with pauses between turns", which is precisely the shape of this build:
# a takeover runbook run step by step, with a human reading output between steps.
# At 5m the cache expires during the reading, and the parent re-sends a 1M-context
# prompt it had already paid to cache.
# ---------------------------------------------------------------------------
prompt_caching:
  cache_ttl: "1h"

# ---------------------------------------------------------------------------
# TOOL LOOP GUARDRAILS
#
# A model that cannot make a tool call work will try again, and the default posture
# is to warn rather than stop. That is right at a terminal, where a human sees the
# warning. It is wrong for anything this build delegates -- subagents on NIM, Codex
# runs through the MCP shim -- because nobody is watching and a loop burns the
# children's rate-limit bucket until the task times out.
#
# `non_interactive_hard_stop_enabled` is the key that matters here and it is ALREADY
# true upstream; it is written out explicitly rather than inherited so that a future
# upstream default change cannot quietly turn it off.
# ---------------------------------------------------------------------------
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false            # interactive: warn, let the human judge
  non_interactive_hard_stop_enabled: true   # delegated: stop, nobody is watching
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

# ---------------------------------------------------------------------------
# SKILLS
#
# `external_dirs` is the most useful thing found in the upstream reference and it is
# LEFT COMMENTED ON PURPOSE, because turning it on changes how this repo is
# installed and that is the owner's call, not a default.
#
# Today TAKEOVER step 3.4 copies hermes-skills/* into ~/.hermes/skills/. That copy is
# a fork the moment it lands: a `git pull` in the repo does not reach it, and nothing
# reports the drift. external_dirs points Hermes at the checkout instead -- read-only,
# so skill creation still writes to ~/.hermes/skills/ -- and the skills a `git pull`
# brings in are live with no second step.
#
# The trade is that the checkout must exist wherever Hermes runs, and a deleted or
# moved repo silently removes 29 skills. Decide deliberately; do not just uncomment it.
# ---------------------------------------------------------------------------
skills:
  # Every N tool-calling iterations, nudge the model to consider saving a skill.
  # 0 disables. Left at the upstream default rather than tuned blind.
  creation_nudge_interval: 15
  # external_dirs:
  #   - ${HERMES_BUILD_REPO}/hermes-skills
