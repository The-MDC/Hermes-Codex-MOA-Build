# capabilities.yaml — the single declaration of what this orchestration can do.
#
# WHY THIS FILE EXISTS
#     Capabilities in this build are not shared, they are DUPLICATED, and the
#     duplicates had already diverged before anything noticed: 78 skills under
#     .claude/skills/, 31 under hermes-skills/, and nine names in common. Ten MCP
#     servers in .mcp.json, seven in config.yaml, two in common.
#
#     Nothing declared any of it. A capability was "available" only because someone
#     remembered to put a copy in the right folder, and CI checked none of it.
#
#     The cost was concrete. `local-desktop` and `hermes-orchestration` were written
#     so the local tier could take the handoff, and they landed in hermes-skills/
#     only -- invisible to the instructing model. Nothing reported that. Both now
#     declare both surfaces, and scripts/port-skills-to-hermes.js projects the Claude
#     copy from the canonical Hermes source rather than anyone maintaining two.
#
# WHAT THIS FILE IS NOT
#     It is not a demand for parity. Hosted MCP servers are kept out of Hermes ON
#     PURPOSE: every discovered tool is injected into the system prompt on EVERY
#     request, which on a ~40 RPM tier is a permanent tax, and checks.yml enforces a
#     deliberate two-name hosted allowlist. Forcing Claude Code's eight hosted
#     servers into Hermes would undo a decision made for a good reason.
#
#     So the contract is narrower and more useful: EVERY capability is declared
#     once, with the surfaces that carry it, and ANY asymmetry carries a reason.
#     scripts/check-capabilities.py fails the build when the tree stops matching this
#     file -- which is what makes the structure binding rather than aspirational.
#
# THE CONTRACT, for anything added later
#     name              the lookup key. For hermes-skills/ that is the DIRECTORY
#                       name; for .claude/skills/ it is the frontmatter `name`,
#                       which is why the two are compared by name and not by path.
#     surfaces          [claude], [hermes], or both. Must match what is on disk.
#     source            ported | hand-written | claude-native
#     category          the directory it lives under
#     asymmetry_reason  REQUIRED whenever `surfaces` has one entry. An asymmetric
#                       capability with no stated reason is a CI failure, because
#                       that is how "we will fix it later" becomes permanent.
#
# datasets, plugins and artifacts are declared-but-empty rather than omitted, so the
# first one added has an obvious home and inherits the same checks.
#
# Regenerate the skeleton from disk with:  python3 scripts/check-capabilities.py --emit
# Then restore the reasons by hand -- the generator cannot know them.
